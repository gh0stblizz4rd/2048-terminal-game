[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "2048-terminal-game"
version = "1.1.0"
description = "A terminal-based 2048 game"
requires-python = ">=3.10"
dependencies = [
    "getkey>=0.6.5; sys_platform != 'win32'",
    "colored"
]

[project.scripts]
game2048 = "game2048.main:main"

[tool.setuptools.packages.find]
where = ["src"]